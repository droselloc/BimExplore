name: Release

# Se dispara al hacer push de un tag tipo v1.0.0
# o manualmente desde la pestania Actions.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore BimExplorer.sln

      - name: Publish single-file (win-x64)
        run: >
          dotnet publish src/BimExplorer.App/BimExplorer.App.csproj
          -c Release
          -r win-x64
          -o publish
          /p:PublishSingleFile=true
          /p:SelfContained=true
          /p:IncludeNativeLibrariesForSelfExtract=true
          /p:IncludeAllContentForSelfExtract=true

      - name: Zip release
        shell: pwsh
        run: |
          Compress-Archive -Path publish/* -DestinationPath BimExplore-win-x64.zip -Force

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          $files = @('publish/BimExplore.exe', 'BimExplore-win-x64.zip')
          $lines = foreach ($f in $files) {
              $hash = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
              "$hash  $(Split-Path $f -Leaf)"
          }
          $lines | Out-File -FilePath SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BimExplore-win-x64
          path: |
            BimExplore-win-x64.zip
            SHA256SUMS.txt

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            BimExplore-win-x64.zip
            SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ## Instalacion

            1. Descarga **`BimExplore-win-x64.zip`**.
            2. Descomprimelo y ejecuta `BimExplore.exe`.

            ## Mi antivirus / Windows lo bloquea

            El ejecutable no esta firmado todavia (los certificados de codigo cuestan dinero), asi que **SmartScreen** o tu antivirus pueden marcarlo como "editor desconocido". Es un falso positivo, el codigo es publico y reproducible desde este repo.

            **Para arrancarlo:**
            - **SmartScreen**: pulsa **More info** -> **Run anyway**.
            - **ZIP descargado**: clic derecho sobre el ZIP -> **Properties** -> marca **Unblock** -> Apply, antes de extraer.
            - **Antivirus**: anade `BimExplore.exe` a las excepciones.

            ## Verificar integridad

            `SHA256SUMS.txt` contiene los hashes oficiales. Comprueba con:

            ```powershell
            Get-FileHash BimExplore-win-x64.zip -Algorithm SHA256
            ```
