name: Release

# Se dispara al hacer push de un tag tipo v1.0.0
# o manualmente desde la pestania Actions.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore BimExplorer.sln

      - name: Publish single-file (win-x64)
        run: >
          dotnet publish src/BimExplorer.App/BimExplorer.App.csproj
          -c Release
          -r win-x64
          -o publish
          /p:PublishSingleFile=true
          /p:SelfContained=true
          /p:IncludeNativeLibrariesForSelfExtract=true
          /p:EnableCompressionInSingleFile=true

      - name: Zip release
        shell: pwsh
        run: |
          Compress-Archive -Path publish/* -DestinationPath BimExplore-win-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BimExplore-win-x64
          path: BimExplore-win-x64.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: BimExplore-win-x64.zip
          generate_release_notes: true
